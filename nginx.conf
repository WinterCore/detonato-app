# The landing page and the web app, a port each (see Dockerfile).

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Build files are named by their hash and never change: kept for a year.
# Everything else, the pages first, is checked each time.
map $uri $detonato_cache {
  ~^/(_astro|assets)/  "public, max-age=31536000, immutable";
  default              "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /srv/landing;
  add_header Cache-Control $detonato_cache;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 8081;
  server_name _;
  root /srv/app;
  add_header Cache-Control $detonato_cache;

  # One page: any path that isn't a file is a screen (/history, /timer…), drawn by index.html.
  location / {
    try_files $uri /index.html;
  }
}
